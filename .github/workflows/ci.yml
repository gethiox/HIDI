name: CI

on:
  # Every pull request, including ones stacked on another feature branch.
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to a commit, with the version it belongs to beside it:
# a version tag can be moved to other code, a commit cannot.
jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: go mod tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        # Build staticcheck with the project's toolchain; a staticcheck built
        # with an older Go cannot analyze code for a newer one.
        env:
          GOTOOLCHAIN: local
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - name: go test
        run: go test -race ./...

  test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}${{ matrix.goarm && format(' v{0}', matrix.goarm) || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: arm, goarm: "7" }
          - { goos: linux, goarch: arm, goarm: "6" }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    env:
      CGO_ENABLED: "0"
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      GOARM: ${{ matrix.goarm }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: go build
        run: go build -trimpath -o dist/ ./cmd/hidi
      - name: go vet (target platform)
        run: go vet ./...

  integration-linux:
    # Runs the tests that need real kernel interfaces, which are skipped
    # everywhere else. The kernel of the hosted runners is built without
    # sound support, so the tests run in a virtual machine that boots
    # Ubuntu's generic kernel on top of the runner's own file system.
    name: Integration (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Build the test binaries
        run: |
          mkdir -p "$RUNNER_TEMP/tests"
          go test -race -c -o "$RUNNER_TEMP/tests/alsaseq.test" ./internal/output/alsaseq
          go test -race -c -o "$RUNNER_TEMP/tests/evdev.test" ./internal/input/evdev
          go test -race -c -o "$RUNNER_TEMP/tests/e2e.test" ./internal/e2e
          go build -race -o "$RUNNER_TEMP/tests/hidi" ./cmd/hidi
      - name: Install the virtual machine and a generic kernel
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq virtme-ng qemu-system-x86 linux-image-generic
      - name: Run the tests on the generic kernel
        run: |
          kernel=$(ls /boot/vmlinuz-*-generic | sort -V | tail -n 1)
          echo "kernel: $kernel"
          # The HIDI_REQUIRE_* variables turn a missing kernel interface into
          # a failure instead of a skip. The exit status is printed and
          # checked from the log, so that the result does not depend on how
          # the VM tool reports it.
          sudo vng --run "$kernel" -- sh -c "
            status=0
            modprobe snd-seq || status=1
            modprobe uinput || status=1
            HIDI_REQUIRE_ALSA=1 '$RUNNER_TEMP/tests/alsaseq.test' -test.v || status=1
            HIDI_REQUIRE_UINPUT=1 '$RUNNER_TEMP/tests/evdev.test' -test.v || status=1
            HIDI_E2E_BINARY='$RUNNER_TEMP/tests/hidi' '$RUNNER_TEMP/tests/e2e.test' -test.v || status=1
            echo \"tests exited with status \$status\"
          " 2>&1 | tee "$RUNNER_TEMP/vm.log"
          grep -q 'tests exited with status 0' "$RUNNER_TEMP/vm.log"
