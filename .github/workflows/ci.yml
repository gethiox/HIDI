name: CI

on:
  # Every pull request, including ones stacked on another feature branch.
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: go mod tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        # Build staticcheck with the project's toolchain; a staticcheck built
        # with an older Go cannot analyze code for a newer one.
        env:
          GOTOOLCHAIN: local
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - name: go test
        run: go test -race ./...

  test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}${{ matrix.goarm && format(' v{0}', matrix.goarm) || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: arm, goarm: "7" }
          - { goos: linux, goarch: arm, goarm: "6" }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    env:
      CGO_ENABLED: "0"
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      GOARM: ${{ matrix.goarm }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go build
        run: go build -trimpath -o dist/ ./cmd/hidi
      - name: go vet (target platform)
        run: go vet ./...

  integration-linux:
    # Runs the tests that need real kernel interfaces, which are skipped
    # everywhere else.
    name: Integration (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Load the ALSA sequencer
        run: |
          # The module is not part of the base kernel package on every image.
          if ! sudo modprobe snd-seq; then
            echo "::group::diagnostics"
            uname -a
            find /lib/modules -name 'snd*' | head -20 || true
            sudo apt-get update -qq
            apt-cache search --names-only '^linux-modules' | grep -i -e azure -e "$(uname -r | cut -d- -f1,2)" | head -40 || true
            apt-cache policy virtme-ng qemu-system-x86 linux-image-generic || true
            ls -l /dev/kvm || true
            echo "::endgroup::"
            sudo apt-get install -y "linux-modules-extra-$(uname -r)" || sudo apt-get install -y linux-modules-extra-azure
            sudo modprobe snd-seq
          fi
          # udev normally creates the device node; do it by hand otherwise.
          for _ in 1 2 3 4 5; do [ -e /dev/snd/seq ] && break; sleep 1; done
          if [ ! -e /dev/snd/seq ]; then
            sudo mkdir -p /dev/snd
            sudo mknod /dev/snd/seq c 116 1
          fi
          sudo chmod a+rw /dev/snd/seq
          ls -l /dev/snd/
      - name: go test (ALSA sequencer)
        env:
          HIDI_REQUIRE_ALSA: "1"
        run: go test -race -v ./internal/output/...
