schema = 1
name = "Default gamepad"

# For every game controller: pads, sticks, throttles, wheels, button boxes.
# One line names what nearly all of them have, a stick that bends the
# pitch. Everything else a controller has plays by its number, as
# [generate] says, so a pad of ten buttons and a stick of a hundred are
# both instruments from the start, and the same ones every time.

[match]
type = "gamepad"

[defaults]
octave = 0
transpose = 0
channel = 1
velocity = 64
layout = "Default"
collision = "interrupt"
# The part of an axis's travel next to its rest that is ignored, for every
# axis that names none of its own: 0.05 for a stick that does not quite
# come back to the middle.
deadzone = 0

# A button or an axis that has no line in a layout, nor in [global], gets
# its part by the number the window shows it by:
#
#   - button n plays the n-th note from the one named here;
#   - the directions of a hat are buttons after the last button;
#   - axis n sends the n-th controller from the one named here, stepping
#     over the controllers that mean something of their own (the choice of
#     a bank, the pedals and so on).
#
# A control that is to stay silent says so: BTN_TL = "nothing".
[generate]
notes = "C1"
controllers = 16

[[layout]]
name = "Default"

[layout.bindings]
# The stick, or the left one of two, bends the pitch when pushed forward
# and pulled back.
ABS_Y = { pitch_bend = true, centered = true, invert = true }
