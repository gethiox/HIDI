<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  The logo of OpenRGB (https://openrgb.org), drawn anew after the picture
  the project uses: a colour wheel as the glass of a light bulb, with a
  keyhole in it. HIDI shows it where it tells whether the lights of a
  keyboard are driven through OpenRGB.

  The wheel is a mesh gradient (SVG 2; Inkscape draws it). It has six
  patches in one row that goes once around the middle: each is a slice of
  sixty degrees between two of red, yellow, green, cyan, blue and magenta.
  The upper edge of a patch is the arc at the rim, the lower one a tiny
  arc at the middle, so that colour changes with the angle only. Where
  mesh gradients are not drawn, the wheel is grey.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="165" height="218" viewBox="0 0 165 218" version="1.1">
  <defs>
    <meshgradient id="wheel" gradientUnits="userSpaceOnUse" x="1.5" y="82">
      <meshrow>
      <meshpatch>
        <stop path="c 0,-28.76 15.343,-55.335 40.25,-69.715" stop-color="#ff0000" />
        <stop path="l 39.75,68.849" stop-color="#ffff00" />
        <stop path="c -0.309,0.179 -0.5,0.509 -0.5,0.866" stop-color="#ffff00" />
        <stop path="l -79.5,0" stop-color="#ff0000" />
      </meshpatch>
      <meshpatch>
        <stop path="c 24.907,-14.38 55.593,-14.38 80.5,-0" />
        <stop path="l -39.75,68.849" stop-color="#00ff00" />
        <stop path="c -0.309,-0.179 -0.691,-0.179 -1,0" stop-color="#00ff00" />
      </meshpatch>
      <meshpatch>
        <stop path="c 24.907,14.38 40.25,40.955 40.25,69.715" />
        <stop path="l -79.5,0" stop-color="#00ffff" />
        <stop path="c 0,-0.357 -0.191,-0.687 -0.5,-0.866" stop-color="#00ffff" />
      </meshpatch>
      <meshpatch>
        <stop path="c 0,28.76 -15.343,55.335 -40.25,69.715" />
        <stop path="l -39.75,-68.849" stop-color="#0000ff" />
        <stop path="c 0.309,-0.179 0.5,-0.509 0.5,-0.866" stop-color="#0000ff" />
      </meshpatch>
      <meshpatch>
        <stop path="c -24.907,14.38 -55.593,14.38 -80.5,0" />
        <stop path="l 39.75,-68.849" stop-color="#ff00ff" />
        <stop path="c 0.309,0.179 0.691,0.179 1,0" stop-color="#ff00ff" />
      </meshpatch>
      <meshpatch>
        <stop path="c -24.907,-14.38 -40.25,-40.955 -40.25,-69.715" />
        <stop path="l 79.5,-0" stop-color="#ff0000" />
        <stop path="c 0,0.357 0.191,0.687 0.5,0.866" stop-color="#ff0000" />
      </meshpatch>
      </meshrow>
    </meshgradient>
  </defs>
  <!-- The glass: a disc of colour with a black rim. -->
  <circle cx="82" cy="82" r="80.5" fill="url(#wheel) #808080" stroke="#000000" stroke-width="3" />
  <!-- The keyhole: a round hole that widens down to the base. -->
  <path d="M 71.5,107.2 A 27.5,27.5 0 1 1 92.5,107.2 L 107,159 H 57 Z" fill="#ffffff" stroke="#000000" stroke-width="3" stroke-linejoin="round" />
  <!-- The base: a core, three threads and the contact at the bottom. -->
  <g fill="#000000">
    <rect x="57" y="158" width="50" height="50" />
    <rect x="49" y="157" width="66" height="14" rx="5" />
    <rect x="51" y="183" width="62" height="12" rx="5" />
    <rect x="53" y="198" width="58" height="10" rx="5" />
    <rect x="67" y="203" width="30" height="14" rx="7" />
  </g>
</svg>
